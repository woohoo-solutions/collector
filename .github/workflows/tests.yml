# The offline test suite: no device, no network beyond installing the
# dependencies. pyATS ships Linux and macOS wheels only, so this runs on Linux.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/py${{ matrix.python-version }}.txt

      - name: Install, at the locked versions
        run: |
          python -m pip install --upgrade pip
          # The exact set the suite was last passed on (tools/lock_dependencies.sh).
          python -m pip install -c constraints/py${{ matrix.python-version }}.txt -e .

      - name: Prove the install
        run: disconet-collector --version

      - name: Offline test suite
        run: python -m unittest discover -s tests -t .

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the sdist and wheel, and check them
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
          python tools/check_wheel.py dist/*.whl
