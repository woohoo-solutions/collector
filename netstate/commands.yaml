# Per-OS allowlist of show commands.
#
# HARD RULE: this file is the ONLY source of commands the tool may send to a
# device. Anything not listed here raises CommandNotAllowed. Only "show"
# commands belong here — see disconet/collector.py::CommandPolicy, which
# additionally rejects any entry that is not a show command or that contains a
# configuration keyword.
#
# Structure:
#   <os>:
#     parse:     ordered list of allowlisted show commands collected from every
#                device, whatever the engineer selected. Each is executed once;
#                the captured output is then handed to the Genie parser. A
#                command with no parser for this platform keeps its raw text
#                and is marked `unparsed` in the manifest.
#     raw_only:  never parsed, raw text only. `show running-config` is
#                read-only and is collected to source the Appendix B
#                configuration excerpts, and to tell an interface that is
#                configured for a routing protocol from one that merely has an
#                adjacency.
#     features:  optional groups, each named after a protocol or a service.
#                Every group is allowlisted and validated exactly like `parse`;
#                the selection made at collect time decides which groups are
#                actually SENT. Deselecting a group narrows what leaves the
#                tool, it never widens it.
#     probe:     OPT-IN. Ignored unless `collect --verify-reachability` is
#                given, and the ONLY entries here that are not show commands.
#                A probe measures reachability rather than reading state, so it
#                is held to a separate and much narrower rule: the template
#                must be exactly `ping {addr}`, and {addr} is only ever
#                substituted with an address this collection itself learned
#                (a dynamic ARP or IPv6 neighbour entry), validated by Python's
#                `ipaddress` module before the command is rendered. Nothing
#                else can be sent — see disconet/collector.py::ProbePolicy.
#     per_vrf:   templates rendered once per VRF, held to the probe's rule:
#                the template must be one of the fixed forms in
#                disconet/collector.py::PER_VRF_TEMPLATES, and {vrf} is only
#                ever substituted with a VRF name this collection itself
#                read (from the running configuration or the VRF table),
#                validated against the characters a VRF name is made of.
#                Needed where a VRF's ARP table is its own and the OS has no
#                all-VRFs form: IOS-XE and IOS-XR. NX-OS says `vrf all` and
#                Junos prints every instance in one table, so neither lists
#                one.
#
# Feature keys are shared by every platform and are what the collect-time menus
# offer. Protocols: ospf, isis, bgp, vpnv4, ldp, sr, srv6, ptp, bfd, lsdb,
# multicast, switching, lag, evpn. Services: l3vpn, l2vpn, mplste, srte, qos,
# routing, management, security. A platform that lacks a group simply has no
# entry for it, and the menu says so.
#
# `sr` and `srv6` are separate keys, as are `mplste` and `srte`: SR-MPLS and
# SRv6 are different data planes, an RSVP-TE tunnel and an SR-TE policy are
# different objects, and an estate migrating between them runs both at once.
#
# Raw output for every command is redacted at collection time, before it
# reaches disk: any line carrying a password, secret, key or SNMP community
# string loses its value.

iosxe:
  parse:
    - show version
    - show inventory
    # Chassis model and what is installed in it. `show inventory` names the
    # parts; `show platform` says which slot each one is in and whether it is
    # up, which is what a hardware table is actually asked for.
    - show platform
    - show cdp neighbors detail
    - show lldp neighbors detail
    - show ip interface brief
    # Full form as well as brief: only this one carries the prefix length,
    # which is what turns an address list into subnets for the Layer 3
    # addressing table and for point-to-point adjacency.
    - show ip interface
    - show ipv6 interface
    # Genie's IOS-XE parser for the full form above requires every interface to
    # carry an IPv6 address, so one interface without one loses the whole
    # device's IPv6 addressing. The brief form has no mask but survives it.
    - show ipv6 interface brief
    - show interfaces description
    # The interface table, for the MAC each port answers with: what a
    # switch's MAC table calls this router, which places the router on a
    # switch port without a neighbour protocol and without any address.
    - show interfaces
    # ARP and IPv6 neighbour tables: an entry whose address belongs to another
    # collected interface is direct evidence of an adjacency, independent of
    # CDP and LLDP. The global table only; each VRF's is read under per_vrf.
    - show ip arp
    - show ipv6 neighbors
  raw_only:
    - show running-config
  per_vrf:
    - show ip arp vrf {vrf}
  features:
    ospf:
      parse:
        - show ip ospf neighbor
        # Every OSPF-enabled interface, adjacency or not. This is what tells an
        # interface that is configured and quiet from one that is not
        # configured at all, which the infrastructure addressing table has to
        # distinguish.
        - show ip ospf interface brief
        # OSPFv3, asked alongside OSPFv2 because "does this network route
        # IPv6" is answered protocol by protocol, not by a separate IPv6
        # selection. Both are read from the text: the neighbour table and
        # the interfaces OSPFv3 runs on. An IOS-XE process carries an
        # address family per instance, and the header names it.
        - show ospfv3 neighbor
        - show ospfv3 interface brief
    isis:
      parse:
        - show isis neighbors
        # Every interface, each saying whether IS-IS is its routing protocol:
        # on IOS and IOS-XE, IS-IS rides CLNS and this is where the interfaces
        # it runs on are listed. Read from the text. `show isis interface
        # brief` is the IOS-XR command — Genie parses it for IOS-XR alone —
        # and asked here it left an estate's IOS-XE routers out of every
        # table built on IGP interfaces.
        - show clns interface
        # The detail form names each neighbour's IPv4 and IPv6 addresses and
        # the topologies the adjacency carries, which is where "IS-IS carries
        # IPv6 here" is stated; the summary form above does not say.
        - show isis neighbors detail
    lsdb:
      parse:
        # The link-state databases, read from the text. One router holds the
        # whole area or level, so this is where the routers DiscoNet never
        # reached are named: IS-IS with their hostnames, OSPF by router ID.
        - show isis database detail
        - show ip ospf database router
        - show ip ospf database network
    bgp:
      parse:
        # One command per address family, because "BGP is running" and "this
        # address family is activated" are different statements and only a
        # per-family summary tells them apart. A family whose command comes
        # back empty is not activated; one whose command was never sent is
        # not collected, and the document says which.
        - show ip bgp summary
        - show bgp ipv6 unicast summary
    vpnv4:
      parse:
        - show bgp vpnv4 unicast all summary
        - show bgp vpnv6 unicast all summary
    routing:
      parse:
        # Never the whole table: the summary says how many routes each
        # source supplies, and the static and connected routes are the
        # bounded parts of it. The VRF tables are not summarised here — a
        # per-VRF command would have to be rendered, and the allowlist holds
        # literals only.
        - show ip route summary
        - show ip route static
        - show ip route connected
        - show ipv6 route summary
        - show ipv6 route static
    ldp:
      parse:
        - show mpls interfaces
        - show mpls ldp neighbor
        # Discovery separates a link hello from a targeted one, which is the
        # difference between a solid and a dotted line on the LDP diagram.
        - show mpls ldp discovery
    bfd:
      parse:
        # `details` is the form that names the registered protocols, the
        # timers and the state per session; the brief table has no parser.
        - show bfd neighbors details
    sr:
      parse:
        - show segment-routing mpls state
        - show segment-routing mpls connected-prefix-sid-map ipv4
    # SRv6 is a separate reading from `sr` above, not a variant of it: that one
    # is SR-MPLS — an SRGB and labels — and this is locators and SIDs in the
    # IPv6 data plane. A network can run either, both or neither.
    srv6:
      parse:
        # The locators configured on this device, which is what says SRv6 is
        # enabled here at all rather than merely supported by the image.
        # The SID table and the SRv6 manager are not asked for: nothing reads
        # them yet, and a command no reader takes only puts a gap in the
        # document wherever Genie has no parser for it. They come back with
        # the reader that describes each SID and its behaviour.
        - show segment-routing srv6 locator
    # Multicast is ONE selection covering both readings, because in practice
    # they are one question. A network that runs PIM in the global table and a
    # network that runs MVPN over it are the same network, documented together
    # or not at all: the default MDT group is what carries a customer's
    # multicast across the same core the global-table PIM adjacencies are
    # formed over, and describing one without the other produces a document
    # that explains half a path.
    #
    # Several of these have no Genie parser on IOS-XE and come back `unparsed`.
    # That is not a gap: the raw text is captured, redacted, and stored in the
    # estate database exactly as parsed state is, and the readers take it from
    # there. A command no reader takes would be one, which is why the PIM
    # interface list and the IGMP groups are not asked for: they come back
    # with a reader of their own.
    multicast:
      parse:
        # The global table: who the PIM neighbours are, and which RP the device
        # maps a group to. An interface with a PIM neighbour is a
        # multicast-capable link, and that is the multicast equivalent of the
        # IGP adjacency the topology is built from.
        - show ip pim neighbor
        - show ip pim rp mapping
        # The IPv6 side of the same question: PIM neighbours over IPv6 and
        # the MLD memberships, read from the text.
        - show ipv6 pim neighbor
        - show ipv6 mld groups
        # The forwarding state itself — the (S,G) and (*,G) entries and their
        # incoming and outgoing interfaces. This is what says traffic is
        # actually being forwarded rather than merely signalled.
        - show ip mroute
        # Multicast VPN. `mdt` names the default and data MDT groups per VRF,
        # which is the tunnel a customer's multicast rides across the core;
        # `mdt bgp` names the PE that each MDT group was learned from, which is
        # what turns a list of groups into a picture of who talks to whom.
        - show ip pim mdt
        - show ip pim mdt bgp
        # BGP-signalled MVPN, for the profiles that use it rather than PIM in
        # the core. A device running a PIM-signalled profile answers this with
        # nothing, which is itself the fact that tells the two apart.
        - show bgp ipv4 mvpn all summary
        # The MVPN routes themselves. The type 1 routes are the auto-discovery:
        # one per PE per VPN, which is how a PE learns who else carries the
        # VPN's multicast, and so the only place the membership of a
        # BGP-AD profile (3, 9, 11 to 15) is stated. Type 3 announces a data
        # or partitioned tree, types 6 and 7 are the customer joins where
        # C-multicast signalling is BGP.
        - show bgp ipv4 mvpn all
        # The mLDP trees: root, opaque value and downstream clients per LSM.
        # The opaque value names what the tree is for — `[mdt RD N]` for a
        # default (0), data or partitioned MDT, `[ipv4 S G]` or `[vpnv4 RD S G]`
        # for in-band signalling (profiles 6 and 7) — so this one output says
        # which profile the data plane is actually running, whatever the
        # configuration intends.
        - show mpls mldp database
    ptp:
      parse:
        # This one carries the whole IOS-XE reading: the clock state in its
        # header, the clock-port in the slave role under PORT SUMMARY, and
        # that port's peer address under SESSION INFORMATION. The address is
        # what resolves to a neighbouring router — a loopback here, by
        # recommended design.
        #
        # The domain number is lab-specific and deliberately literal: a
        # different domain means editing this line, not passing a value
        # through the tool, so the allowlist stays a list of exact strings.
        - show ptp clock running domain 44
        # Steps removed from the grandmaster, and the offset from it.
        - show ptp clock dataset current
        # The parent dataset names the clock this device follows and the
        # default dataset names the clock it is. Matching one against the
        # other settles which session is the source where a clock-port holds
        # more than one, and identifies the grandmaster of the domain.
        - show ptp clock dataset parent
        - show ptp clock dataset default
    lag:
      parse:
        - show etherchannel summary
    l3vpn:
      parse:
        - show vrf detail
    l2vpn:
      parse:
        - show mpls l2transport vc detail
        - show l2vpn service all
    evpn:
      parse:
        # The control plane: every L2VPN EVPN session. The data plane: the
        # VTEPs this one has tunnels to, and the VNIs it serves.
        - show bgp l2vpn evpn summary
        - show nve peers
        - show nve vni
    mplste:
      parse:
        - show mpls traffic-eng tunnels
    # Read separately from `mplste` above for the same reason SRv6 is read
    # separately from SR-MPLS: an RSVP-TE tunnel and an SR-TE policy are
    # different objects, signalled differently, and an estate migrating from
    # one to the other runs both at once.
    srte:
      parse:
        # IOS-XE spells the all-policies form with an explicit `all`; the
        # bare form takes a policy name and renders nothing from an
        # allowlist that holds exact strings.
        - show segment-routing traffic-eng policy all
    qos:
      parse:
        # Which service policy is attached to which interface, and in which
        # direction. The running configuration already on disk is the primary
        # reading — it is the same on both platforms and it is what "a policy
        # is applied" actually means — and this corroborates it with the
        # device's own operational view of the attachment.
        - show policy-map interface
        # The policies themselves: classes and what each one does. This is what
        # lets the document describe a policy rather than only name it.
        - show policy-map
    # The management plane is read from the running configuration already
    # captured above; these are the two states the configuration cannot
    # give: whether the clock is synchronised and to whom, and what the
    # control-plane policy has conformed and dropped.
    management:
      parse:
        - show ntp associations
        - show policy-map control-plane
    # The access layer under a router: what a switch knows that a router does
    # not. VLANs and the ports in each; each port's mode, access VLAN, native
    # VLAN and allowed list, from both the per-port and the trunk views because
    # only the trunk view says which VLANs are actually forwarding; the
    # spanning tree per VLAN or instance with the root, the bridge and each
    # port's role, and the detail form because it alone prints the designated
    # bridge on every port — the far switch's bridge ID, which proves a link
    # between two collected switches with LLDP switched off; and the MAC
    # table, which places the router's ARP entries on access ports. A MAC
    # table is a moment: the document says so.
    switching:
      parse:
        - show vlan
        - show interfaces switchport
        - show interfaces trunk
        - show spanning-tree
        - show spanning-tree detail
        # Only the MST configuration says which VLANs each instance carries;
        # without it a VLAN's root under several instances is unknown.
        - show spanning-tree mst configuration
        - show mac address-table
  probe:
    - ping {addr}

