        - show ntp associations
        - show policy-map control-plane
    # The access layer under a router: what a switch knows that a router does
    # not. VLANs and the ports in each; each port's mode, access VLAN, native
    # VLAN and allowed list, from both the per-port and the trunk views because
    # only the trunk view says which VLANs are actually forwarding; the
    # spanning tree per VLAN or instance with the root, the bridge and each
    # port's role, and the detail form because it alone prints the designated
    # bridge on every port — the far switch's bridge ID, which proves a link
    # between two collected switches with LLDP switched off; and the MAC
    # table, which places the router's ARP entries on access ports. A MAC
    # table is a moment: the document says so.
    switching:
      parse:
        - show vlan
        - show interfaces switchport
        - show interfaces trunk
        - show spanning-tree
        - show spanning-tree detail
        # Only the MST configuration says which VLANs each instance carries;
        # without it a VLAN's root under several instances is unknown.
        - show spanning-tree mst configuration
        - show mac address-table
  probe:
    - ping {addr}

iosxr:
  parse:
    - show version
    - show inventory
    - show platform
    - show cdp neighbors detail
    - show lldp neighbors detail
    - show ipv4 interface brief
    # `show ipv4 vrf all interface` is the IOS-XR equivalent of IOS-XE's
    # `show ip interface`: the brief form omits the prefix length, and the
    # `vrf all` form is also what carries VRF interface addressing.
    - show ipv4 vrf all interface
    # The same for IPv6: without `vrf all` a 6VPE interface's address is
    # never read. The plain form stays as the reading where the `vrf all`
    # one does not parse, and is what a snapshot taken before carries.
    - show ipv6 vrf all interface
    - show ipv6 interface
    # The interface table, for the MAC each port answers with; see IOS-XE.
    - show interfaces
    # The global ARP table; each VRF's is read under per_vrf.
    - show arp detail
    - show ipv6 neighbors
  raw_only:
    - show running-config
  per_vrf:
    - show arp vrf {vrf} detail
  features:
    ospf:
      parse:
        - show ospf neighbor
        - show ospf interface brief
        # OSPFv3 beside OSPFv2; see the IOS-XE note.
        - show ospfv3 neighbor
        - show ospfv3 interface brief
    isis:
      parse:
        - show isis adjacency
        - show isis neighbors
        - show isis interface brief
        # Per adjacency: the neighbour's IPv4 and IPv6 addresses and the
        # topologies it carries, which is where IS-IS's IPv6 is stated.
        - show isis adjacency detail
    lsdb:
      parse:
        # The link-state databases; see the IOS-XE note.
        - show isis database detail
        - show ospf database router
        - show ospf database network
    bgp:
      parse:
        # `show bgp summary` with no address family is IPv4 unicast on XR.
        - show bgp summary
        - show bgp ipv6 unicast summary
    vpnv4:
      parse:
        - show bgp vpnv4 unicast summary
        - show bgp vpnv6 unicast summary
    routing:
      parse:
        # The default VRF's tables; see the IOS-XE note.
        - show route summary
        - show route ipv4 static
        - show route ipv4 connected
        - show route ipv6 static
    ldp:
      parse:
        - show mpls interfaces
        - show mpls ldp neighbor
        - show mpls ldp discovery
    bfd:
      parse:
        - show bfd session
    sr:
      parse:
        - show segment-routing local-block
        - show isis segment-routing label table
    # See the note on the IOS-XE side: SRv6 is a separate reading from
    # SR-MPLS, not a variant of it, and only its locators have a reader yet.
    srv6:
      parse:
        - show segment-routing srv6 locator
    # See the note on the IOS-XE side: one selection, both readings, because
    # the global table and the MVPN overlay are one question.
    multicast:
      parse:
        # IOS-XR drops the `ip` and keeps the rest: `show pim neighbor` rather
        # than `show ip pim neighbor`. The reading is the same one.
        - show pim neighbor
        # The IPv6 side: PIM neighbours over IPv6 and MLD memberships.
        - show pim ipv6 neighbor
        - show mld groups
        # XR states RP-to-group mapping as a group map rather than an RP
        # mapping, and it includes the auto-configured ranges — which is what
        # distinguishes a configured RP from a default.
        - show pim group-map
        # MRIB rather than mroute. The summary is taken as well as the table
        # because a core router's full multicast table is large and the counts
        # are what a document actually quotes.
        - show mrib route summary
        - show mrib route
        # Multicast VPN, per VRF. `vrf all` is the only form that answers for
        # every VRF at once, and the allowlist holds exact strings, so it is
        # written out rather than templated per VRF.
        - show pim vrf all mdt cache
        - show pim vrf all neighbor
        - show bgp ipv4 mvpn summary
        # See the IOS-XE side: the type 1 routes are the membership of every
        # BGP-AD profile, and the mLDP database is the data plane as built.
        - show bgp ipv4 mvpn
        - show mpls mldp database
    ptp:
      parse:
        # The servo's device status is IOS-XR's statement about its own clock,
        # and it gates everything below: a device in FREERUN is following
        # nothing, whatever masters it can still hear.
        - show ptp platform servo
        # Every clock heard, per receiving interface, with the steps removed
        # that decides which of them the device follows. IOS-XR synchronises
        # over physical interface addresses rather than loopbacks, so this is
        # where the neighbouring router's address comes from.
        #
        # Both spellings are listed because the two are not consistent across
        # XR releases. A platform that has neither answers `unsupported`,
        # which is reported once rather than treated as a failure — and means
        # the device does not participate in PTP.
        - show ptp foreign masters
        - show ptp foreign-masters
        - show ptp advertised-clock
    lag:
      parse:
        # Members, state and the effective bandwidth of every bundle.
        - show bundle
    l3vpn:
      parse:
        - show vrf all detail
    l2vpn:
      parse:
        - show l2vpn xconnect detail
        - show l2vpn bridge-domain
    evpn:
      parse:
        # IOS-XR has no VXLAN; its EVPN is the control plane over MPLS, and
        # the EVIs are the instances it serves.
        - show bgp l2vpn evpn summary
        - show evpn evi
    mplste:
      parse:
        - show mpls traffic-eng tunnels
    # See the note on the IOS-XE side: an RSVP-TE tunnel and an SR-TE policy
    # are different objects, and an estate mid-migration runs both.
    srte:
      parse:
        # The policies themselves: colour, endpoint, and which candidate path
        # is active.
        - show segment-routing traffic-eng policy
        # What is actually programmed, as against what is configured. A policy
        # that is up in one and absent from the other is a real finding.
        - show segment-routing traffic-eng forwarding policy
    qos:
      parse:
        # IOS-XR has no per-interface form that takes no argument, and the
        # allowlist renders nothing. `targets` lists every policy-map with the
        # interfaces and directions it is attached to, which is the same fact
        # from the other end.
        - show policy-map targets
        - show policy-map
    management:
      parse:
        # The configuration carries the rest; LPTS has no summary Genie parses.
        - show ntp associations
  probe:
    - ping {addr}

# NX-OS. The data-centre reading: every interface command is `vrf all`, the
# module table stands in for `show platform`, and the overlay and the vPC
# domain are what the aggregation and EVPN features read.
nxos:
  parse:
    - show version
    - show inventory
    # NX-OS has no `show platform`; the module table is what says which
    # slot holds what and whether it is up.
    - show module
    - show cdp neighbors detail
    - show lldp neighbors detail
    # `vrf all` on every interface command: a VRF-aware switch lists only
    # the default VRF without it, and a data-centre switch keeps most of
    # its addressed interfaces in VRFs.
    - show ip interface brief vrf all
    - show ip interface vrf all
    - show ipv6 interface vrf all
    - show interface description
    # The interface table, for the MAC each port answers with; see IOS-XE.
    - show interface
    # The ARP and IPv6 neighbour tables, all VRFs. `detail` is the form
    # Genie parses into the same shape as the IOS-XE table.
    - show ip arp detail vrf all
    - show ipv6 neighbor detail vrf all
  raw_only:
    - show running-config
  features:
    ospf:
      parse:
        # `detail` is the only neighbour form Genie parses on NX-OS. It
        # nests the neighbours under VRF, family, instance, area and
        # interface, and the reader walks down to them.
        - show ip ospf neighbors detail vrf all
        - show ip ospf interface vrf all
        # OSPFv3 beside OSPFv2, every VRF; read from the text.
        - show ospfv3 neighbors vrf all
        - show ospfv3 interface brief vrf all
    isis:
      parse:
        - show isis adjacency vrf all
        - show isis interface vrf all
        # Each neighbour's IPv4 and IPv6 addresses and topologies.
        - show isis adjacency detail vrf all
    lsdb:
      parse:
        # The link-state databases, every VRF; see the IOS-XE note.
        - show isis database detail vrf all
        - show ip ospf database router detail vrf all
        - show ip ospf database network detail vrf all
    bgp:
      parse:
        # One summary, every VRF and every address family. Which family a
        # session belongs to is read off the VRF and family it sits under,
        # in the same vocabulary the Junos summary is read in.
        - show bgp vrf all all summary
    vpnv4:
      parse:
        # The same command: VPNv4 is the `vpnv4 unicast` family in the
        # default VRF plus the `ipv4 unicast` sessions inside each VRF.
        - show bgp vrf all all summary
    routing:
      parse:
        # `vrf all`: every VRF's summary and statics from one command each.
        # `direct` is what NX-OS calls a connected route.
        - show ip route summary vrf all
        - show ip static-route vrf all
        - show ip route direct vrf all
        - show ipv6 route summary vrf all
        - show ipv6 static-route vrf all
    bfd:
      parse:
        # Singular: `show bfd neighbors` is the IOS-XE spelling and NX-OS
        # answers only the singular one.
        - show bfd neighbor
    lag:
      parse:
        # Port-channels and their members, and the vPC domain: two switches
        # presenting one port-channel to a neighbour.
        - show port-channel summary
        - show vpc
    l3vpn:
      parse:
        # Name, RD and state per VRF. Route targets are not in it: they are
        # read from the `vrf context` stanzas of the running configuration,
        # and membership from the interface table below.
        - show vrf all detail
        - show vrf all interface
    evpn:
      parse:
        - show bgp l2vpn evpn summary
        - show nve peers
        - show nve vni
    management:
      parse:
        # `peer-status` is the NX-OS spelling of the associations table.
        - show ntp peer-status
    # The access layer, as on IOS-XE. The switchport view carries the allowed
    # list and the native VLAN; only the trunk view says which of the allowed
    # VLANs the spanning tree forwards on each trunk now, the one proof that a
    # trunk carries a VLAN. Genie has no NX-OS parser for `show interface
    # trunk`, nor for the bare spanning-tree table, and both are read from the
    # text.
    switching:
      parse:
        - show vlan
        - show interface switchport
        - show interface trunk
        - show spanning-tree
        - show spanning-tree detail
        # Only the MST configuration says which VLANs each instance carries;
        # without it a VLAN's root under several instances is unknown.
        - show spanning-tree mst configuration
        - show mac address-table
  probe:
    - ping {addr}

# Junos. The same reading as the two Cisco platforms wherever Junos states the
# same fact, under the name Junos gives it. What is absent here is absent on
# purpose for now: SR, SRv6, multicast, PTP, L2VPN, MPLS TE, SR-TE and QoS
# have no Junos commands yet, so on a Junos device those features are
# `[NOT COLLECTED]` per device rather than misread. Add them when their
# reading exists.
junos:
  parse:
    - show version
    - show chassis hardware
    # Junos has no CDP. The brief LLDP table carries the neighbour's system
    # name, its port ID and its port description; the description is what
    # names the far interface where the port ID is the numeric ifIndex Junos
    # advertises by default.
    - show lldp neighbors
    # Addresses sit on the logical unit under `protocol inet`/`inet6`, with
    # the prefix length, and the same output carries admin and link state.
    - show interfaces terse
    - show interfaces descriptions
    # The full interface table, for the MAC each physical interface answers
    # with (`Current address`); see IOS-XE. Every logical unit shares it.
    - show interfaces
    # ARP and IPv6 neighbour tables, as on the Cisco side: an entry whose
    # address belongs to another collected interface is evidence of an
    # adjacency independent of LLDP. `no-resolve` keeps the output to
    # addresses and stops the device doing a DNS lookup per entry.
    - show arp no-resolve
    - show ipv6 neighbors
  raw_only:
    # Redacted like every raw output: `encrypted-password`, `authentication-key`
    # and `pre-shared-key` lines lose their value before the file is written.
    - show configuration
  features:
    ospf:
      parse:
        - show ospf neighbor
        - show ospf interface
        # OSPFv3 beside OSPFv2; Junos spells it `ospf3`. Read from the text.
        - show ospf3 neighbor
        - show ospf3 interface
    isis:
      parse:
        - show isis adjacency
        - show isis interface
        # Each neighbour's IP and IPv6 addresses and the topologies carried.
        - show isis adjacency detail
    lsdb:
      parse:
        # The link-state databases; `extensive` is the form that lists each
        # LSP's neighbours and prefixes and each LSA's links.
        - show isis database extensive
        - show ospf database router extensive
        - show ospf database network extensive
    bgp:
      parse:
        # One summary carries every address family, one RIB row per family
        # under each peer: inet.0, inet6.0, bgp.l3vpn.0, bgp.l3vpn-inet6.0.
        - show bgp summary
    vpnv4:
      parse:
        # The same command: the VPNv4 reading is the bgp.l3vpn.0 rows of it.
        # Listed under both features because either selection needs it, and
        # a command in two groups is sent once.
        - show bgp summary
    routing:
      parse:
        # One summary carries every table, inet.0 and inet6.0 and each
        # VRF's own; the statics and directs come out per protocol.
        - show route summary
        - show route protocol static
        - show route protocol direct
    ldp:
      parse:
        # `neighbor` is the discovery — hello adjacencies, with the interface
        # they were heard on, `lo0.0` for a targeted one. `session` is the
        # session state per peer.
        - show ldp neighbor
        - show ldp session
        - show mpls interface
    bfd:
      parse:
        - show bfd session
    l3vpn:
      parse:
        # Instance type, RD, the interfaces in it and the route targets it
        # imports and exports, per routing instance.
        - show route instance detail
        # A VRF configured with `vrf-import`/`vrf-export` policies rather
        # than `vrf-target` names its policies here, not its targets. The
        # policies name communities, and the communities carry the
        # `target:AS:N` members: that is where the route target is read from,
        # so VPNs on such an estate still match by target rather than by name.
        # Configuration, so redacted like the rest; it carries no secrets
        # of its own.
        - show configuration policy-options
    l2vpn:
      parse:
        # The three Junos Layer 2 VPN readings: LDP-signalled pseudowires
        # (l2circuit), BGP-signalled ones (l2vpn) and VPLS. None has a
        # parser; all three print the remote PE, the state and the local
        # interface per connection and are read from the text.
        - show l2circuit connections
        - show l2vpn connections
        - show vpls connections
    evpn:
      parse:
        # The one summary already carries the bgp.evpn.0 sessions; listed
        # here so selecting EVPN alone still sends it. Junos has no parser
        # for its VXLAN tunnel table, so the data plane is not read yet.
        - show bgp summary
    security:
      parse:
        # SRX only. An MX answers both with a syntax error, which comes back
        # as text (unicon's Junos settings carry no error pattern) and names
        # no cluster; a standalone SRX answers that its cluster is not
        # enabled, which is how it is known for a firewall. Neither has a
        # parser: both are read from the text.
        - show chassis cluster status
        - show security zones
    management:
      parse:
        - show ntp associations
    # The access layer on an EX or a QFX. None of these has a parser; all are
    # read from the text. `interface` in the singular is accepted by both the
    # ELS and the older CLI, which spell the plural differently. The
    # spanning-tree interface table prints the designated bridge ID per port,
    # the same evidence the Cisco detail form gives.
    switching:
      parse:
        - show vlans
        - show ethernet-switching interface
        - show ethernet-switching table
        - show spanning-tree bridge
        - show spanning-tree interface
  # No probe. The one template the probe policy allows is `ping {addr}`,
  # and on Junos that runs until interrupted, so every probe would sit on
  # the command timeout. Reachability verification does nothing on a
  # Junos device, and the manifest records that no probe was sent.

# Cisco ASA. A firewall is a node like any other, read in its own vocabulary:
# no CDP and no LLDP, so its links are proved by ARP (keyed by nameif) and
# by shared addressing; a failover pair is two chassis that each print the
# other's serial; a context is a virtual firewall inside the chassis.
asa:
  parse:
    - show version
    - show inventory
    # The one interface table with the mask (as a dotted subnet), the nameif
    # and the link state together. `show interface ip brief` has no mask.
    - show interface detail
    # Name and security level per interface.
    - show nameif
    - show arp
    # No parser on this platform; kept as text.
    - show ipv6 neighbor
  raw_only:
    - show running-config
  features:
    routing:
      parse:
        # The same three bounded forms as everywhere else, spelt without
        # `ip`. None has a parser on ASA; all three are read from the text.
        # Never `show route` on its own: a firewall at an edge can carry a
        # full feed like any router.
        - show route summary
        - show route static
        - show route connected
    security:
      parse:
        - show failover
        - show context
        - show vpn-sessiondb summary
  probe:
    - ping {addr}
